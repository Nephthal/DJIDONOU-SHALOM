<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/style.css?v=10">
  <title>Contact – DJIDONOU SHALOM IMMO</title>
  <meta name="description" content="Contactez DJIDONOU SHALOM IMMO : téléphone, WhatsApp, e-mail et adresse de l'agence.">
</head>
<body data-page="contact">
<section class="page-hero">
  <div class="page-hero-bg"><img data-parallax="0.1" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=70" alt="" onerror="this.style.opacity=0"></div>
  <div class="container">
    <nav class="crumbs"><a href="index.html">Accueil</a> / <span>Contact</span></nav>
    <h1>Parlons de votre projet</h1>
    <p>Une question sur une parcelle, une location ou la gestion de votre bien ? Nous vous répondons rapidement.</p>
  </div>
</section>
<section class="section-sm" style="margin-top:-60px;position:relative;z-index:2;padding-bottom:90px">
  <div class="container contact-grid">
    <div class="panel"><h2>Nos coordonnées</h2><div id="contact-info"></div></div>
    <div class="panel">
      <h2>Écrivez-nous</h2>
      <form class="form" data-lead="Contact">
        <div class="row"><input name="name" placeholder="Nom complet *" required><input name="phone" placeholder="Téléphone / WhatsApp *" type="tel" required></div>
        <input name="email" placeholder="E-mail" type="email">
        <select name="subject"><option>Achat d'une parcelle</option><option>Achat d'une maison</option><option>Location</option><option>Gestion locative</option><option>Vendre mon bien</option><option>Autre</option></select>
        <textarea name="message" rows="5" placeholder="Votre message"></textarea>
        <button class="btn btn-primary btn-block">Envoyer</button>
      </form>
      <div class="form-done" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 5 5L20 7"/></svg><b>Message envoyé !</b><p class="muted">Nous vous répondons très vite.</p><a class="btn btn-wa btn-block" target="_blank" rel="noopener">Continuer sur WhatsApp</a></div>
    </div>
  </div>
  <div class="container" style="margin-top:28px"><div id="contact-map" class="map map-md"></div></div>
</section>
<script src="assets/vendor/leaflet/leaflet.js"></script>

</body>
</html>
